<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BPSC TRE 4.0 — CS Practice Portal</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2E8;--paper-2:#EFE9DA;--ink:#1C2740;--ink-soft:#4A5468;
  --maroon:#8B2331;--maroon-dark:#6E1B27;--green:#2E6B44;--green-bg:#E4EFE6;
  --red:#B0392C;--red-bg:#F5E4E0;--line:#D8CFB8;--amber:#9C6B14;
  --shadow:0 2px 10px rgba(28,39,64,0.08);--violet:#6D4AFF;--teal:#0FA3A3;
  --sunset:#FF6B4A;--gold:#E8A93B;
  --grad-hero:linear-gradient(120deg,#1C2740 0%,#3A2E6E 45%,#8B2331 100%);
  --grad-btn:linear-gradient(120deg,#8B2331 0%,#B33A2E 55%,#E8A93B 130%);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background-color:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;
  background-image:radial-gradient(circle at 1px 1px,rgba(28,39,64,0.05) 1px,transparent 0);background-size:22px 22px;}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
@media(max-width:640px){.wrap{padding:16px 12px 60px}.card{padding:16px}.qcard{padding:16px}}
h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:700;letter-spacing:-0.01em;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:26px;}
@media(max-width:480px){.brand h1{font-size:17px;line-height:1.25}.brand .eyebrow{font-size:10px}.topbar{margin-bottom:18px}}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--maroon);font-weight:600;}
.brand h1{font-size:22px;color:var(--ink)}
.seal{width:52px;height:52px;flex-shrink:0;}.seal img{width:100%;height:100%;display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:5px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;transition:transform .08s,box-shadow .15s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(28,39,64,.18)}.btn:active{transform:translateY(0)}
.btn.secondary{background:#fff;color:var(--ink)}.btn.maroon{background:var(--maroon);border-color:var(--maroon)}
.btn.maroon:hover{box-shadow:0 4px 10px rgba(139,35,49,.28)}
.btn.gradient{background:var(--grad-btn);border:none;color:#fff;box-shadow:0 4px 14px rgba(139,35,49,.35)}
.btn.gradient:hover{box-shadow:0 6px 20px rgba(139,35,49,.45);transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn.block{width:100%}
/* Auth */
.auth-hero{background:var(--grad-hero);border-radius:14px;padding:44px 24px 100px;text-align:center;position:relative;overflow:hidden;margin-bottom:-70px;box-shadow:0 10px 30px rgba(28,39,64,.25);}
.auth-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,169,59,.35) 0%,transparent 70%);}
.auth-hero::after{content:'';position:absolute;bottom:-80px;left:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(15,163,163,.30) 0%,transparent 70%);}
.auth-hero-inner{position:relative;z-index:1}
.auth-seal{width:88px;height:88px;margin:0 auto 16px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));}
.auth-seal img{width:100%;height:100%;display:block}
.auth-title{font-family:'Source Serif 4',serif;color:#fff;font-size:30px;font-weight:700;margin-bottom:6px}
.auth-subtitle{color:#E9E6D8;font-size:14.5px;margin-bottom:20px}
.auth-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.auth-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:6px 12px;border-radius:14px;color:#fff;border:1px solid rgba(255,255,255,.35);}
.auth-badge.b1{background:rgba(232,169,59,.25)}.auth-badge.b2{background:rgba(15,163,163,.25)}.auth-badge.b3{background:rgba(255,107,74,.25)}
.auth-card{position:relative;z-index:2;max-width:420px;margin:0 auto;box-shadow:0 14px 34px rgba(28,39,64,.18);border-top:4px solid var(--gold);}
.auth-tab{flex:1;text-align:center;padding:10px 14px}
.auth-tab.active{background:var(--grad-hero);border-color:transparent;color:#fff}
@media(max-width:480px){.auth-hero{padding:34px 16px 90px;margin-bottom:-64px}.auth-title{font-size:24px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.mode-card{border:1.5px solid var(--line);border-radius:8px;padding:20px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s,transform .15s;position:relative;overflow:hidden;}
.mode-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--line)}
.mode-card.c-blue::before{background:linear-gradient(90deg,#1a5276,#2471a3)}
.mode-card.c-teal::before{background:linear-gradient(90deg,var(--teal),var(--violet))}
.mode-card.c-sunset::before{background:linear-gradient(90deg,var(--sunset),var(--gold))}
.mode-card.c-maroon::before{background:linear-gradient(90deg,var(--maroon),#b33a2e)}
.mode-card:hover{border-color:var(--maroon);box-shadow:var(--shadow);transform:translateY(-2px)}
.mode-card .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px;display:block;color:var(--maroon);}
.mode-card.c-teal .tag{color:var(--teal)}.mode-card.c-sunset .tag{color:var(--sunset)}.mode-card.c-blue .tag{color:#1a5276}
.mode-card h3{font-size:19px;margin-bottom:6px}.mode-card p{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin:0}
input[type=text],input[type=password]{font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);}
.set-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.set-pill{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);cursor:pointer;background:#fff;color:var(--ink-soft);}
.set-pill.active{border-color:var(--maroon);color:var(--maroon);background:var(--red-bg)}
.muted{color:var(--ink-soft);font-size:13.5px;line-height:1.6}
.hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:var(--paper);padding:14px 0 10px;z-index:5;border-bottom:1.5px solid var(--line);margin-bottom:18px;}
.timer{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;background:var(--ink);color:#fff;padding:8px 16px;border-radius:5px;letter-spacing:.03em;flex-shrink:0;}
@media(max-width:480px){.quiz-top{padding:10px 0 8px}.timer{font-size:16px;padding:6px 12px}.qtext{font-size:15.5px}.qcard{padding:16px 14px}.option{padding:12px;gap:10px}.option-text{font-size:13.5px}.bubble{width:26px;height:26px;font-size:12px}}
.timer.low{background:var(--maroon);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.progress-bar{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--maroon);transition:width .2s}
.qcard{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;box-shadow:var(--shadow)}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.qnum{font-family:'IBM Plex Mono',monospace;color:var(--maroon);font-weight:700;font-size:14px}
.qtopic{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);background:var(--paper-2);padding:3px 9px;border-radius:12px}
.qtext{font-size:17px;line-height:1.55;margin-bottom:20px;font-weight:500}
.option{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1.5px solid var(--line);border-radius:6px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.12s;}
.option:hover{border-color:var(--ink-soft)}.option.selected{border-color:var(--maroon);background:var(--red-bg)}
.bubble{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12.5px;color:var(--ink-soft);}
.option.selected .bubble{border-color:var(--maroon);background:var(--maroon);color:#fff}
.option-text{font-size:14.5px;line-height:1.4}
.navrow{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
@media(max-width:480px){.navrow{flex-direction:column}.navrow .btn{width:100%}}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
@media(max-width:640px){.palette{grid-template-columns:repeat(8,1fr)}}
@media(max-width:400px){.palette{grid-template-columns:repeat(6,1fr);gap:5px}}
.pnode{aspect-ratio:1;border-radius:4px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-soft);cursor:pointer;background:#fff;min-height:30px;}
.pnode.answered{background:var(--green);border-color:var(--green);color:#fff}
.pnode.current{outline:2px solid var(--maroon);outline-offset:1px}
.score-hero{background:var(--ink);color:#fff;border-radius:8px;padding:28px 24px;text-align:center;margin-bottom:20px;}
.score-hero .big{font-family:'Source Serif 4',serif;font-size:52px;font-weight:700;line-height:1}
@media(max-width:480px){.score-hero{padding:22px 16px}.score-hero .big{font-size:40px}}
.score-hero .lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#C9CEDA;margin-top:6px}
.score-hero .verdict{margin-top:14px;font-size:15px;color:#E9E6D8}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media(max-width:640px){.stat-row{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;text-align:center}
.stat .num{font-family:'Source Serif 4',serif;font-size:26px;font-weight:700}.stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px}
.topicbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topicbar-label{width:190px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0}
.topicbar-track{flex:1;height:16px;background:var(--paper-2);border-radius:8px;overflow:hidden}
.topicbar-fill{height:100%;border-radius:8px}
.topicbar-pct{width:42px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;flex-shrink:0}
@media(max-width:480px){.topicbar-row{flex-wrap:wrap}.topicbar-label{width:100%;font-size:12px}.topicbar-track{height:12px}.history-row{flex-direction:column;align-items:flex-start;gap:4px}}
.review-q{border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px;background:#fff}
.review-q .qtext{font-size:15.5px;margin-bottom:14px}
.rowbadge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em;}
.rowbadge.correct{background:var(--green-bg);color:var(--green)}.rowbadge.wrong{background:var(--red-bg);color:var(--red)}.rowbadge.skipped{background:var(--paper-2);color:var(--ink-soft)}
.review-opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:5px;margin-bottom:6px;font-size:14px;border:1px solid transparent}
.review-opt.correct-opt{background:var(--green-bg);border-color:var(--green)}.review-opt.wrong-opt{background:var(--red-bg);border-color:var(--red)}
.review-explain{margin-top:10px;font-size:13.5px;color:var(--ink-soft);background:var(--paper);padding:10px 12px;border-radius:5px;border-left:3px solid var(--maroon)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:5px;border:1.5px solid var(--line);cursor:pointer;background:#fff;color:var(--ink-soft);}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.hidden{display:none!important}
.loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace}
.weakbox{background:var(--red-bg);border:1px solid var(--red);border-radius:6px;padding:16px}
.weakbox h3{color:var(--red);font-size:15px;margin-bottom:8px}
.weakbox ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink)}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:5px;margin-bottom:8px;font-size:13.5px}
.footer-note{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px}
.syl-row{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="eyebrow">BPSC TRE 4.0 · Computer Science</span>
      <h1 id="titleLink" style="cursor:pointer">Practice Portal — Prelims &amp; Mains</h1>
    </div>
    <div class="seal"><img src="/favicon.svg" alt="BPSC TRE logo"></div>
  </div>
  <div id="app"><div class="loading">Loading…</div></div>
  <div class="footer-note">BPSC TRE 4.0 · Computer Science Teacher Recruitment Exam · Bihar</div>
</div>
<script type="module">
const app=document.getElementById('app');
document.getElementById('titleLink').onclick=()=>{if(currentUser)renderHome();};

const SUPABASE_URL='https://llptkwjlikvfztxsotmk.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscHRrd2psaWt2Znp0eHNvdG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI4MzQsImV4cCI6MjEwMTg2ODgzNH0.D6t8f_vOq426mrTVxPufRUqe_6LWLf-doldXJNqGEXg';
const AVAILABLE_SETS=[1,2,3,4,5];
const FULL_TEST_MINUTES=150;
const SECTION_MINUTES={1:25,2:35,3:70};
const PART_NAMES={1:'Part I — Language',2:'Part II — General Studies',3:'Part III — Computer Science'};

let sb=null,state={},currentUser=null;

function showFatalError(ctx,err){
  console.error(ctx,err);
  app.innerHTML=`<div class="card" style="text-align:center"><h2 style="font-size:18px;margin-bottom:8px">Couldn't load the app</h2><p class="muted" style="margin-bottom:16px">${ctx}. Usually a temporary network hiccup.</p><button class="btn maroon" onclick="location.reload()">Retry</button></div>`;
}

async function boot(){
  try{const mod=await import('https://esm.sh/@supabase/supabase-js@2');sb=mod.createClient(SUPABASE_URL,SUPABASE_KEY);}
  catch(err){showFatalError('Failed to load Supabase client from CDN',err);return;}
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session&&session.user){currentUser={id:session.user.id,email:session.user.email};await attachProfileName();}
    if(window.location.hash.includes('access_token'))window.history.replaceState({},document.title,window.location.pathname);
  }catch(err){console.error('Session check failed:',err);}
  sb.auth.onAuthStateChange((_,session)=>{if(!session)currentUser=null;});
  try{currentUser?renderHome():renderLogin();}catch(err){showFatalError('Failed to render app',err);}
}
boot();

async function attachProfileName(){
  if(!currentUser)return;
  try{const{data}=await sb.from('profiles').select('full_name').eq('id',currentUser.id).single();if(data&&data.full_name)currentUser.name=data.full_name;}
  catch(e){console.error('Profile fetch failed:',e);}
}

/* ══════════════════════════════════════════
   AUTH
══════════════════════════════════════════ */
function renderLogin(msg,startOnSignup,msgType){
  app.innerHTML=`
    <div class="auth-hero"><div class="auth-hero-inner">
      <div class="auth-seal"><img src="/favicon.svg" alt="BPSC TRE logo"></div>
      <h1 class="auth-title">BPSC TRE 4.0</h1>
      <p class="auth-subtitle">Computer Science Practice Portal</p>
      <div class="auth-badges">
        <span class="auth-badge b1">Prelims — GK+GS</span>
        <span class="auth-badge b2">Mains — 5 Full Sets</span>
        <span class="auth-badge b3">Live Leaderboard</span>
      </div>
    </div></div>
    <div class="card auth-card">
      <div class="tabs" style="margin-bottom:0">
        <div class="tab auth-tab ${startOnSignup?'':'active'}" id="tabSI">Sign In</div>
        <div class="tab auth-tab ${startOnSignup?'active':''}" id="tabSU">Create Account</div>
      </div>
      ${msg?`<p style="color:${msgType==='ok'?'var(--teal)':'var(--maroon)'};font-size:13.5px;margin:14px 0 0;font-weight:600">${msg}</p>`:''}
      <div id="resendWrap" class="hidden" style="margin-top:8px">
        <button class="btn secondary" id="resendBtn" style="font-size:12.5px;padding:8px 14px">Resend confirmation email</button>
      </div>
      <div style="margin-top:16px">
        <div id="nameWrap" class="${startOnSignup?'':'hidden'}">
          <label class="muted" style="display:block;margin-bottom:6px;font-size:13px">Your name</label>
          <input type="text" id="nameInput" placeholder="e.g. Nitish Kumar" style="width:100%;margin-bottom:14px" autocomplete="name">
        </div>
        <label class="muted" style="display:block;margin-bottom:6px;font-size:13px">Email address</label>
        <input type="text" id="emailInput" placeholder="you@example.com" style="width:100%;margin-bottom:14px" autocomplete="email">
        <label class="muted" style="display:block;margin-bottom:6px;font-size:13px">Password</label>
        <input type="password" id="passInput" placeholder="At least 6 characters" style="width:100%;margin-bottom:6px" autocomplete="current-password">
        <p class="muted" id="passHint" style="font-size:12px;margin-bottom:14px;${startOnSignup?'':'visibility:hidden'}">Minimum 6 characters.</p>
        <button class="btn gradient block" id="submitAuthBtn">${startOnSignup?'Create account & start practicing':'Sign in'}</button>
      </div>
    </div>`;
  let isSignup=!!startOnSignup,lastEmail='';
  const nameWrap=document.getElementById('nameWrap'),nameInput=document.getElementById('nameInput'),
    emailInput=document.getElementById('emailInput'),passInput=document.getElementById('passInput'),
    passHint=document.getElementById('passHint'),submitBtn=document.getElementById('submitAuthBtn'),
    tabSI=document.getElementById('tabSI'),tabSU=document.getElementById('tabSU');
  function setMode(su){
    isSignup=su;tabSI.classList.toggle('active',!su);tabSU.classList.toggle('active',su);
    submitBtn.textContent=su?'Create account & start practicing':'Sign in';
    passHint.style.visibility=su?'visible':'hidden';
    nameWrap.classList.toggle('hidden',!su);
    passInput.setAttribute('autocomplete',su?'new-password':'current-password');
  }
  tabSI.onclick=()=>setMode(false);tabSU.onclick=()=>setMode(true);
  async function submit(){
    const name=nameInput?nameInput.value.trim():'',email=emailInput.value.trim(),password=passInput.value;
    if(isSignup&&!name){renderLogin('Please enter your name.',true);return;}
    if(!email||!email.includes('@')||!email.includes('.')){renderLogin('Please enter a valid email.',isSignup);return;}
    if(!password||password.length<6){renderLogin('Password must be at least 6 characters.',isSignup);return;}
    submitBtn.disabled=true;submitBtn.textContent=isSignup?'Creating account…':'Signing in…';
    try{
      if(isSignup){
        const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
        if(error)throw error;
        if(data.session){currentUser={id:data.user.id,email:data.user.email,name};renderHome();}
        else renderLogin('Account created! Switch to Sign In and log in.',false,'ok');
      }else{
        const{data,error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        currentUser={id:data.user.id,email:data.user.email};await attachProfileName();renderHome();
      }
    }catch(err){
      const raw=err.message||'';
      if(/email not confirmed/i.test(raw)){lastEmail=email;document.getElementById('resendWrap').classList.remove('hidden');renderLogin('Email not confirmed. Check inbox or resend below.',isSignup);return;}
      const friendly=/invalid login credentials/i.test(raw)?'Incorrect email or password.':/already registered|already exists/i.test(raw)?'That email already has an account — try Sign In.':(raw||'Something went wrong.');
      renderLogin(friendly,isSignup);
    }
  }
  document.getElementById('resendBtn').onclick=async()=>{
    const rb=document.getElementById('resendBtn');rb.disabled=true;rb.textContent='Sending…';
    try{const{error}=await sb.auth.resend({type:'signup',email:lastEmail});if(error)throw error;renderLogin('Confirmation email re-sent!',false,'ok');}

async function loadHistory(){
  const el=document.getElementById('historyList');if(!el)return;
  try{
    const res=await sb.from('attempts').select('*').not('submitted_at','is',null).order('started_at',{ascending:false}).limit(5);
    if(res.error)throw res.error;
    if(!res.data||res.data.length===0){el.innerHTML='<span class="muted">No attempts yet — take a test!</span>';return;}
    el.innerHTML=res.data.map(a=>{
      const label=a.mode==='full'?`Full Test · Set ${a.set_number}`:`${PART_NAMES[a.part]?.split('—')[1]?.trim()||'Section'} · Set ${a.set_number}`;
      const ms=a.merit_total?`${a.merit_score}/${a.merit_total}`:'—';

      return `<div class="history-row"><span>${label} <span class="muted">· ${date}</span></span><span class="mono" style="font-weight:600">${ms}</span></div>`;
    }).join('');
  }catch(e){console.error(e);el.innerHTML='<span class="muted">Couldn\'t load history.</span>';}
}

/* ══════════════════════════════════════════
   MAINS QUIZ (unchanged logic)
══════════════════════════════════════════ */
let timerInterval=null;
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

async function startQuiz({mode,setNumber,part}){
  if(!requireAuth())return;stopPTimer();
  app.innerHTML=`<div class="loading">Preparing your paper…</div>`;
  let q=sb.from('questions').select('*').eq('set_number',setNumber).order('part').order('q_no');
  if(mode==='section')q=q.eq('part',part);
  const{data:questions,error}=await q;
  if(error||!questions||questions.length===0){app.innerHTML=`<div class="card">Could not load questions. <button class="btn secondary" onclick="location.reload()">Retry</button></div>`;return;}
  const durationSec=mode==='full'?FULL_TEST_MINUTES*60:SECTION_MINUTES[part]*60;
  const{data:attemptRow}=await sb.from('attempts').insert({mode,set_number:setNumber,part:mode==='section'?part:null,duration_seconds:durationSec,user_id:currentUser.id}).select().single();
  state={mode,setNumber,part,questions,answers:{},idx:0,remaining:durationSec,attemptId:attemptRow?attemptRow.id:null};
  renderQuiz();stopTimer();
  timerInterval=setInterval(()=>{state.remaining--;updateTimerDisplay();if(state.remaining<=0){stopTimer();submitQuiz();}},1000);
}

function updateTimerDisplay(){const el=document.getElementById('timerDisplay');if(!el)return;el.textContent=fmtTime(Math.max(0,state.remaining));el.classList.toggle('low',state.remaining<=60);}

function currentPartLabel(){if(state.mode==='section')return PART_NAMES[state.part];return PART_NAMES[state.questions[state.idx].part];}

function renderQuiz(){
  const q=state.questions[state.idx],total=state.questions.length,ac=Object.keys(state.answers).length;
  app.innerHTML=`
    <div class="quiz-top">
      <div><div class="mono" style="font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em">${currentPartLabel()}</div>
      <div style="font-size:13px;color:var(--ink-soft)">${ac}/${total} answered</div></div>
      <div id="timerDisplay" class="timer">${fmtTime(state.remaining)}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${ac/total*100}%"></div></div>
    <div class="qcard" style="margin-top:18px">
      <div class="qmeta"><span class="qnum">Q${state.idx+1} / ${total}</span><span class="qtopic">${q.topic}</span></div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      <div id="optionsWrap"></div>
      <div class="navrow">
        <button class="btn secondary" id="prevBtn" ${state.idx===0?'disabled':''}>← Previous</button>
        ${state.idx===total-1?`<button class="btn maroon" id="submitBtn">Submit Test</button>`:`<button class="btn" id="nextBtn">Next →</button>`}
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <div style="font-size:12.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:8px">QUESTION PALETTE — green=answered · click to jump</div>
      <div class="palette" id="palette"></div>
      <div class="navrow" style="margin-top:16px"><button class="btn secondary" id="submitBtn2">Submit ${state.mode==='full'?'Full Test':'Section'}</button></div>
    </div>`;
  updateTimerDisplay();
  const opts=[{k:'A',v:q.option_a},{k:'B',v:q.option_b},{k:'C',v:q.option_c},{k:'D',v:q.option_d},{k:'E',v:"None of the above / I don't want to answer this"}];
  const ow=document.getElementById('optionsWrap');
  ow.innerHTML=opts.map(o=>`<div class="option ${state.answers[q.id]===o.k?'selected':''} ${o.k==='E'?'none':''}" data-k="${o.k}"><div class="bubble">${o.k}</div><div class="option-text">${escapeHtml(o.v)}</div></div>`).join('');
  ow.querySelectorAll('.option').forEach(el=>{el.onclick=()=>{state.answers[q.id]=el.dataset.k;renderQuiz();};});
  const prev=document.getElementById('prevBtn');if(prev)prev.onclick=()=>{state.idx--;renderQuiz();};
  const next=document.getElementById('nextBtn');if(next)next.onclick=()=>{state.idx++;renderQuiz();};
  const sb1=document.getElementById('submitBtn');if(sb1)sb1.onclick=confirmSubmit;
  document.getElementById('submitBtn2').onclick=confirmSubmit;
  const pal=document.getElementById('palette');
  pal.innerHTML=state.questions.map((qq,i)=>{const ans=state.answers[qq.id];return`<div class="pnode ${ans==='E'?'none-ans':ans?'answered':''} ${i===state.idx?'current':''}" data-i="${i}">${i+1}</div>`;}).join('');
  pal.querySelectorAll('.pnode').forEach(el=>{el.onclick=()=>{state.idx=parseInt(el.dataset.i);renderQuiz();};});
}

function confirmSubmit(){
  const total=state.questions.length,answered=Object.keys(state.answers).length,un=total-answered;
  if(confirm(un>0?`You have ${un} unanswered question(s). Submit anyway?`:'Submit now?'))submitQuiz();
}

async function submitQuiz(){
  stopTimer();
  const q=state.questions;
  let lc=0,lt=0,mc=0,mt=0;const ts={};
  const rows=q.map(qq=>{
    const sel=state.answers[qq.id]||null,isC=sel===qq.correct_option;
    if(qq.part===1){lt++;if(isC)lc++;}else{mt++;if(isC)mc++;}
    if(!ts[qq.topic])ts[qq.topic]={correct:0,total:0};
    ts[qq.topic].total++;if(isC)ts[qq.topic].correct++;
    return{attempt_id:state.attemptId,question_id:qq.id,selected_option:sel,is_correct:isC};
  });
  state.result={lc,lt,mc,mt,ts};
  if(state.attemptId){
    try{
      await sb.from('attempts').update({submitted_at:new Date().toISOString(),merit_score:mt>0?mc:null,merit_total:mt>0?mt:null,language_score:lt>0?lc:null,language_total:lt>0?lt:null}).eq('id',state.attemptId);
      if(rows.length)await sb.from('attempt_answers').insert(rows);
    }catch(e){console.error('Save failed:',e);}
  }
  renderResults();
}

function renderResults(){
  const{lc,lt,mc,mt,ts}=state.result;
  const mp=mt?Math.round(mc/mt*100):null;
  const verdict=mt>0?(mp>=82?'Comfortably above projected cut-off (~82–87%). Keep it up!':mp>=70?'Close to danger zone — push weak topics.':'Below safe target. Revisit and reattempt.'):'';
  const sorted=Object.entries(ts).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total));
  const weak=sorted.filter(([,s])=>(s.correct/s.total)<0.6);
  app.innerHTML=`
    ${mt>0?`<div class="score-hero"><div class="big">${mc}<span style="font-size:26px;color:#B7BEC9">/${mt}</span></div><div class="lbl">Merit Score (Part II + III)</div><div class="verdict">${verdict}</div></div>`:''}
    <div class="stat-row">
      ${lt>0?`<div class="stat"><div class="num">${lc}/${lt}</div><div class="lbl">Language (Qualifying)</div></div>`:''}
      ${mt>0?`<div class="stat"><div class="num">${mp}%</div><div class="lbl">Merit Accuracy</div></div>`:''}
      <div class="stat"><div class="num">${Object.keys(state.answers).length}/${state.questions.length}</div><div class="lbl">Attempted</div></div>
    </div>
    <div class="card"><h2 style="font-size:16px;margin-bottom:14px">Topic-wise accuracy</h2>
      ${sorted.map(([t,s])=>{const p=Math.round(s.correct/s.total*100);const c=p>=75?'var(--green)':p>=50?'var(--amber)':'var(--red)';return`<div class="topicbar-row"><div class="topicbar-label">${t}</div><div class="topicbar-track"><div class="topicbar-fill" style="width:${p}%;background:${c}"></div></div><div class="topicbar-pct">${p}%</div></div>`;}).join('')}
    </div>
    ${weak.length?`<div class="card weakbox"><h3>Weak areas (below 60%)</h3><ul>${weak.map(([t,s])=>`<li>${t} — ${Math.round(s.correct/s.total*100)}% (${s.correct}/${s.total})</li>`).join('')}</ul></div>`:''}
    <div class="card"><h2 style="font-size:16px;margin-bottom:14px">Full Review</h2><div id="reviewList"></div></div>
    <div class="navrow">
      <button class="btn secondary" id="retakeBtn">↺ Retake</button>
      <button class="btn secondary" onclick="renderMainsHome()">📘 Mains Home</button>
      <button class="btn maroon" onclick="renderHome()">🏠 Main Menu</button>
    </div>`;
  document.getElementById('reviewList').innerHTML=state.questions.map((qq,i)=>{
    const sel=state.answers[qq.id],isC=sel===qq.correct_option,st=!sel?'skipped':isC?'correct':'wrong';
    const opts=[{k:'A',v:qq.option_a},{k:'B',v:qq.option_b},{k:'C',v:qq.option_c},{k:'D',v:qq.option_d},{k:'E',v:'None of the above'}];
    return`<div class="review-q"><div class="qmeta"><span class="qnum">Q${i+1}</span><span class="rowbadge ${st}">${st}</span></div><div class="qtext">${escapeHtml(qq.question)}</div>${opts.map(o=>{let cls='';if(o.k===qq.correct_option)cls='correct-opt';else if(o.k===sel&&sel!==qq.correct_option)cls='wrong-opt';return`<div class="review-opt ${cls}"><div class="bubble" style="width:22px;height:22px;font-size:11px">${o.k}</div><span>${escapeHtml(o.v)}${o.k===qq.correct_option?' ✓':o.k===sel?' ✗ (your pick)':''}</span></div>`;}).join('')}<div class="review-explain"><strong>Why:</strong> ${escapeHtml(qq.explanation)}</div></div>`;
  }).join('');
  document.getElementById('retakeBtn').onclick=()=>startQuiz({mode:state.mode,setNumber:state.setNumber,part:state.part});
}

let pState={},pTimerIv=null;
function stopPTimer(){if(pTimerIv){clearInterval(pTimerIv);pTimerIv=null;}}

function renderPrelimsInfo(){
  stopTimer();stopPTimer();
  app.innerHTML=`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <h2 style="font-size:19px">📋 Prelims — GK + GS</h2>
        <button class="btn secondary" onclick="renderHome()" style="font-size:12.5px;padding:8px 14px">← Main Menu</button>
      </div>
      <p class="muted" style="margin-bottom:16px"><strong>Pattern:</strong> BPSC CSE Prelims style · 150 questions · GK + General Studies · 120 minutes · No negative marking · Questions shuffle every attempt</p>
      ${[['Bihar GK & History','History, Culture, Geography, Economy, Polity','~30 Qs'],
         ['Indian History & Freedom Movement','Ancient, Medieval, Modern, National Movement','~25 Qs'],
         ['Indian Polity & Constitution','Parliament, Rights, Governance, Articles','~25 Qs'],
         ['Geography — India & World','Physical, Political, Bihar Geography','~20 Qs'],
         ['Science & Technology','Physics, Chemistry, Biology, Environment','~20 Qs'],
         ['Economy, Maths & Current Affairs','Indian Economy, Bihar Economy, Reasoning','~30 Qs']
        ].map(([t,s,n])=>`<div class="syl-row"><div><strong>${t}</strong><div class="muted" style="font-size:12px;margin-top:2px">${s}</div></div><span class="mono" style="color:var(--maroon);font-weight:700">${n}</span></div>`).join('')}
      <button class="btn gradient block" style="margin-top:8px" onclick="startPrelims()">🚀 Start Prelims Paper (120 min)</button>
    </div>`;
}

function startPrelims(){
  pState={questions:shuffle([...PQ]),answers:{},idx:0,remaining:120*60,done:false};
  renderPrelimsQ();stopPTimer();
  pTimerIv=setInterval(()=>{pState.remaining--;updatePTimer();if(pState.remaining<=0){stopPTimer();submitPrelims();}},1000);
}

function updatePTimer(){
  const el=document.getElementById('timerDisplay');if(!el)return;
  el.textContent=fmtTime(Math.max(0,pState.remaining));el.classList.toggle('low',pState.remaining<=300);
}

function renderPrelimsQ(){
  const i=pState.idx,q=pState.questions[i],total=pState.questions.length,ac=Object.keys(pState.answers).length;
  const OK=['A','B','C','D'];
  app.innerHTML=`
    <div class="quiz-top">
      <div><div class="mono" style="font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em">Prelims · ${q.t}</div>
      <div style="font-size:13px;color:var(--ink-soft)">${ac}/${total} answered</div></div>
      <div id="timerDisplay" class="timer">${fmtTime(pState.remaining)}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${ac/total*100}%"></div></div>
    <div class="qcard" style="margin-top:18px">
      <div class="qmeta"><span class="qnum">Q${i+1} / ${total}</span><span class="qtopic">${q.t}</span></div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div id="optionsWrap">
        ${q.o.map((opt,oi)=>`<div class="option ${pState.answers[i]===OK[oi]?'selected':''}" data-k="${OK[oi]}" data-qi="${i}"><div class="bubble">${OK[oi]}</div><div class="option-text">${escapeHtml(opt)}</div></div>`).join('')}
      </div>
      <div class="navrow">
        <button class="btn secondary" id="prevBtn" ${i===0?'disabled':''}>← Previous</button>
        ${i===total-1?`<button class="btn maroon" id="subBtn">Submit Prelims</button>`:`<button class="btn" id="nextBtn">Next →</button>`}
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <div style="font-size:12.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:8px">QUESTION PALETTE — green=answered · click to jump</div>
      <div class="palette" id="palette"></div>
      <div class="navrow" style="margin-top:16px"><button class="btn secondary" id="subBtn2">Submit Prelims Paper</button></div>
    </div>`;
  document.getElementById('optionsWrap').querySelectorAll('.option').forEach(el=>{
    el.onclick=()=>{pState.answers[parseInt(el.dataset.qi)]=el.dataset.k;renderPrelimsQ();};
  });
  const prev=document.getElementById('prevBtn');if(prev)prev.onclick=()=>{pState.idx--;renderPrelimsQ();};
  const next=document.getElementById('nextBtn');if(next)next.onclick=()=>{pState.idx++;renderPrelimsQ();};
  const sb1=document.getElementById('subBtn');if(sb1)sb1.onclick=confirmSubmitPrelims;
  document.getElementById('subBtn2').onclick=confirmSubmitPrelims;
  const pal=document.getElementById('palette');
  pal.innerHTML=pState.questions.map((_,pi)=>`<div class="pnode ${pState.answers[pi]?'answered':''} ${pi===i?'current':''}" data-pi="${pi}">${pi+1}</div>`).join('');
  pal.querySelectorAll('.pnode').forEach(el=>{el.onclick=()=>{pState.idx=parseInt(el.dataset.pi);renderPrelimsQ();};});
  updatePTimer();
}

function confirmSubmitPrelims(){
  const total=pState.questions.length,answered=Object.keys(pState.answers).length,un=total-answered;
  if(confirm(un>0?`${un} question(s) unanswered. Submit anyway?`:'Submit Prelims paper now?'))submitPrelims();
}

function submitPrelims(){stopPTimer();pState.done=true;renderPrelimsResults();}

function renderPrelimsResults(){
  const qs=pState.questions,ans=pState.answers;
  let correct=0,wrong=0,skip=0;const ts={};
  qs.forEach((q,i)=>{
    const uk=ans[i],ck=['A','B','C','D'][q.a];
    const isOk=uk===ck,isSk=!uk;
    if(isSk)skip++;else if(isOk)correct++;else wrong++;
    if(!ts[q.t])ts[q.t]={correct:0,total:0};ts[q.t].total++;if(isOk)ts[q.t].correct++;
  });
  const total=qs.length,pct=Math.round(correct/total*100);
  const verdict=pct>=80?'Excellent! Well above safe cut-off.':pct>=65?'Good. Focus on weak topics.':pct>=50?'Fair — more practice needed.':'Keep going — revision will get you there.';
  const sorted=Object.entries(ts).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total));
  const weak=sorted.filter(([,s])=>(s.correct/s.total)<0.6);
  app.innerHTML=`
    <div class="score-hero">
      <div class="big">${correct}<span style="font-size:26px;color:#B7BEC9">/${total}</span></div>
      <div class="lbl">Prelims Score — GK + GS</div>
      <div class="verdict">${pct}% · ${verdict}</div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num" style="color:var(--green)">${correct}</div><div class="lbl">Correct</div></div>
      <div class="stat"><div class="num" style="color:var(--red)">${wrong}</div><div class="lbl">Wrong</div></div>
      <div class="stat"><div class="num" style="color:var(--amber)">${skip}</div><div class="lbl">Skipped</div></div>
    </div>
    <div class="card"><h2 style="font-size:16px;margin-bottom:14px">Topic-wise accuracy</h2>
      ${sorted.map(([t,s])=>{const p=Math.round(s.correct/s.total*100);const c=p>=75?'var(--green)':p>=50?'var(--amber)':'var(--red)';return`<div class="topicbar-row"><div class="topicbar-label">${t}</div><div class="topicbar-track"><div class="topicbar-fill" style="width:${p}%;background:${c}"></div></div><div class="topicbar-pct">${p}%</div></div>`;}).join('')}
    </div>
    ${weak.length?`<div class="card weakbox"><h3>Weak areas (below 60%)</h3><ul>${weak.map(([t,s])=>`<li>${t} — ${Math.round(s.correct/s.total*100)}% (${s.correct}/${s.total})</li>`).join('')}</ul></div>`:''}
    <div class="card"><h2 style="font-size:16px;margin-bottom:14px">Full Review — answer explanations</h2><div id="prelims-review"></div></div>
    <div class="navrow">
      <button class="btn secondary" onclick="startPrelims()">Retake Prelims</button>
      <button class="btn maroon" onclick="renderHome()">Main Menu</button>
    </div>`;
  const OKS=['A','B','C','D'];
  document.getElementById('prelims-review').innerHTML=qs.map((q,i)=>{
    const uk=ans[i],ck=OKS[q.a];const isOk=uk===ck,isSk=!uk;const st=isSk?'skipped':isOk?'correct':'wrong';
    return`<div class="review-q"><div class="qmeta"><span class="qnum">Q${i+1}</span><span class="rowbadge ${st}">${st}</span></div><div class="qtext">${escapeHtml(q.q)}</div>${q.o.map((opt,oi)=>{const k=OKS[oi];let cls='';if(k===ck)cls='correct-opt';else if(k===uk&&!isOk)cls='wrong-opt';return`<div class="review-opt ${cls}"><div class="bubble" style="width:22px;height:22px;font-size:11px">${k}</div><span>${escapeHtml(opt)}${k===ck?' ✓':k===uk?' ✗ (your pick)':''}</span></div>`;}).join('')}<div class="review-explain"><strong>Why:</strong> ${escapeHtml(q.e)}</div></div>`;
  }).join('');
}

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function escapeHtml(str){if(!str)return'';const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

window.renderHome=renderHome;
window.renderMainsHome=renderMainsHome;
window.renderPrelimsInfo=renderPrelimsInfo;
window.startPrelims=startPrelims;
window.confirmSubmitPrelims=confirmSubmitPrelims;
window.submitPrelims=submitPrelims;
</script>
</body>
</html>
