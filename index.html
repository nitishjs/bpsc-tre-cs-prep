<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BPSC TRE 4.0 — Computer Science Prep</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- ADD THESE 6 LINES BELOW ↓ -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#8B2331" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BPSC TRE CS" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E8;
    --paper-2:#EFE9DA;
    --ink:#1C2740;
    --ink-soft:#4A5468;
    --maroon:#8B2331;
    --maroon-dark:#6E1B27;
    --green:#2E6B44;
    --green-bg:#E4EFE6;
    --red:#B0392C;
    --red-bg:#F5E4E0;
    --line:#D8CFB8;
    --amber:#9C6B14;
    --shadow: 0 2px 10px rgba(28,39,64,0.08);
    --violet:#6D4AFF;
    --teal:#0FA3A3;
    --sunset:#FF6B4A;
    --gold:#E8A93B;
    --grad-hero: linear-gradient(120deg, #1C2740 0%, #3A2E6E 45%, #8B2331 100%);
    --grad-btn: linear-gradient(120deg, #8B2331 0%, #B33A2E 55%, #E8A93B 130%);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      linear-gradient(var(--paper), var(--paper));
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(28,39,64,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
  @media(max-width:640px){
    .wrap{padding:16px 12px 60px}
    .card{padding:16px}
    .qcard{padding:16px}
  }
  h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:700;letter-spacing:-0.01em;margin:0}
  .mono{font-family:'IBM Plex Mono',monospace}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:26px;
  }
  @media(max-width:480px){
    .brand h1{font-size:17px;line-height:1.25}
    .brand .eyebrow{font-size:10px}
    .seal{width:42px;height:42px;font-size:9.5px;border-width:2px}
    .topbar{margin-bottom:18px}
  }
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--maroon);font-weight:600;
  }
  .brand h1{font-size:22px;color:var(--ink)}
  .seal{
    width:52px;height:52px;flex-shrink:0;
  }
  .seal img{width:100%;height:100%;display:block}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:18px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
    padding:12px 20px;border-radius:5px;border:1.5px solid var(--ink);
    background:var(--ink);color:#fff;cursor:pointer;
    transition:transform .08s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(28,39,64,.18)}
  .btn:active{transform:translateY(0)}
  .btn.secondary{background:#fff;color:var(--ink)}
  .btn.maroon{background:var(--maroon);border-color:var(--maroon)}
  .btn.maroon:hover{box-shadow:0 4px 10px rgba(139,35,49,.28)}
  .btn.gradient{background:var(--grad-btn);border:none;color:#fff;box-shadow:0 4px 14px rgba(139,35,49,.35)}
  .btn.gradient:hover{box-shadow:0 6px 20px rgba(139,35,49,.45);transform:translateY(-2px)}
  .btn.gradient:disabled{background:var(--grad-btn);opacity:.55}

  /* Auth hero + card */
  .auth-hero{
    background:var(--grad-hero);
    border-radius:14px;
    padding:44px 24px 100px;
    text-align:center;
    position:relative;
    overflow:hidden;
    margin-bottom:-70px;
    box-shadow:0 10px 30px rgba(28,39,64,.25);
  }
  .auth-hero::before{
    content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,169,59,.35) 0%, transparent 70%);
  }
  .auth-hero::after{
    content:'';position:absolute;bottom:-80px;left:-40px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle, rgba(15,163,163,.30) 0%, transparent 70%);
  }
  .auth-hero-inner{position:relative;z-index:1}
  .auth-seal{
    width:88px;height:88px;margin:0 auto 16px;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));
  }
  .auth-seal img{width:100%;height:100%;display:block}
  .auth-title{font-family:'Source Serif 4',serif;color:#fff;font-size:30px;font-weight:700;margin-bottom:6px}
  .auth-subtitle{color:#E9E6D8;font-size:14.5px;margin-bottom:20px}
  .auth-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .auth-badge{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:6px 12px;border-radius:14px;
    color:#fff;border:1px solid rgba(255,255,255,.35);
  }
  .auth-badge.b1{background:rgba(232,169,59,.25)}
  .auth-badge.b2{background:rgba(15,163,163,.25)}
  .auth-badge.b3{background:rgba(255,107,74,.25)}
  .auth-card{
    position:relative;z-index:2;max-width:420px;margin:0 auto;
    box-shadow:0 14px 34px rgba(28,39,64,.18);border-top:4px solid var(--gold);
  }
  .auth-tabs{margin-bottom:0}
  .auth-tab{flex:1;text-align:center;padding:10px 14px}
  .auth-tab.active{background:var(--grad-hero);border-color:transparent}
  @media(max-width:480px){
    .auth-hero{padding:34px 16px 90px;margin-bottom:-64px}
    .auth-title{font-size:24px}
  }
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.block{width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .mode-card{
    border:1.5px solid var(--line);border-radius:8px;padding:20px;
    cursor:pointer;background:#fff;transition:border-color .15s, box-shadow .15s, transform .15s;
    position:relative;overflow:hidden;
  }
  .mode-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--line)}
  .mode-card.c-teal::before{background:linear-gradient(90deg, var(--teal), var(--violet))}
  .mode-card.c-sunset::before{background:linear-gradient(90deg, var(--sunset), var(--gold))}
  .mode-card:hover{border-color:var(--maroon);box-shadow:var(--shadow);transform:translateY(-2px)}
  .mode-card .tag{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--maroon);font-weight:600;margin-bottom:8px;display:block;
  }
  .mode-card.c-teal .tag{color:var(--teal)}
  .mode-card.c-sunset .tag{color:var(--sunset)}
  .mode-card h3{font-size:19px;margin-bottom:6px}
  .mode-card p{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin:0}
  select,input[type=text]{
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px;
    border:1.5px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);
  }
  .set-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .set-pill{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);
    cursor:pointer;background:#fff;color:var(--ink-soft);
  }
  .set-pill.active{border-color:var(--maroon);color:var(--maroon);background:var(--red-bg)}
  .set-pill.disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
  .muted{color:var(--ink-soft);font-size:13.5px;line-height:1.6}
  .hr{border:none;border-top:1px solid var(--line);margin:18px 0}

  /* quiz header */
  .quiz-top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    position:sticky;top:0;background:var(--paper);padding:14px 0 10px;z-index:5;
    border-bottom:1.5px solid var(--line);margin-bottom:18px;
  }
  .timer{
    font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;
    background:var(--ink);color:#fff;padding:8px 16px;border-radius:5px;
    letter-spacing:.03em;flex-shrink:0;
  }
  @media(max-width:480px){
    .quiz-top{padding:10px 0 8px}
    .timer{font-size:16px;padding:6px 12px}
    .qtext{font-size:15.5px}
    .qcard{padding:16px 14px}
    .option{padding:12px;gap:10px}
    .option-text{font-size:13.5px}
    .bubble{width:26px;height:26px;font-size:12px}
  }
  .timer.low{background:var(--maroon);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
  .progress-bar{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;background:var(--maroon);transition:width .2s}

  .qcard{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;box-shadow:var(--shadow)}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .qnum{font-family:'IBM Plex Mono',monospace;color:var(--maroon);font-weight:700;font-size:14px}
  .qtopic{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);background:var(--paper-2);padding:3px 9px;border-radius:12px}
  .qtext{font-size:17px;line-height:1.55;margin-bottom:20px;font-weight:500}
  .option{
    display:flex;align-items:center;gap:14px;padding:13px 14px;border:1.5px solid var(--line);
    border-radius:6px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.12s;
  }
  .option:hover{border-color:var(--ink-soft)}
  .option.selected{border-color:var(--maroon);background:var(--red-bg)}
  .bubble{
    width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12.5px;color:var(--ink-soft);
  }
  .option.selected .bubble{border-color:var(--maroon);background:var(--maroon);color:#fff}
  .option-text{font-size:14.5px;line-height:1.4}
  .option.none .option-text{font-style:italic;color:var(--ink-soft)}

  .navrow{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
  @media(max-width:480px){
    .navrow{flex-direction:column}
    .navrow .btn{width:100%}
  }
  .palette{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
  @media(max-width:640px){.palette{grid-template-columns:repeat(8,1fr)}}
  @media(max-width:400px){.palette{grid-template-columns:repeat(6,1fr);gap:5px}}
  .pnode{
    aspect-ratio:1;border-radius:4px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;background:#fff;min-height:30px;
  }
  .pnode.answered{background:var(--green);border-color:var(--green);color:#fff}
  .pnode.current{outline:2px solid var(--maroon);outline-offset:1px}
  .pnode.none-ans{background:var(--amber);border-color:var(--amber);color:#fff}

  /* results */
  .score-hero{
    background:var(--ink);color:#fff;border-radius:8px;padding:28px 24px;text-align:center;margin-bottom:20px;
  }
  .score-hero .big{font-family:'Source Serif 4',serif;font-size:52px;font-weight:700;line-height:1}
  @media(max-width:480px){
    .score-hero{padding:22px 16px}
    .score-hero .big{font-size:40px}
  }
  .score-hero .lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#C9CEDA;margin-top:6px}
  .score-hero .verdict{margin-top:14px;font-size:15px;color:#E9E6D8}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:640px){.stat-row{grid-template-columns:1fr}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;text-align:center}
  .stat .num{font-family:'Source Serif 4',serif;font-size:26px;font-weight:700}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .topicbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .topicbar-label{width:190px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0}
  .topicbar-track{flex:1;height:16px;background:var(--paper-2);border-radius:8px;overflow:hidden}
  .topicbar-fill{height:100%;border-radius:8px}
  .topicbar-pct{width:42px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;flex-shrink:0}
  @media(max-width:480px){
    .topicbar-row{flex-wrap:wrap}
    .topicbar-label{width:100%;font-size:12px}
    .topicbar-track{height:12px}
    .history-row{flex-direction:column;align-items:flex-start;gap:4px}
  }

  .review-q{border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px;background:#fff}
  .review-q .qtext{font-size:15.5px;margin-bottom:14px}
  .rowbadge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;
    padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em;
  }
  .rowbadge.correct{background:var(--green-bg);color:var(--green)}
  .rowbadge.wrong{background:var(--red-bg);color:var(--red)}
  .rowbadge.skipped{background:var(--paper-2);color:var(--ink-soft)}
  .review-opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:5px;margin-bottom:6px;font-size:14px;border:1px solid transparent}
  .review-opt.correct-opt{background:var(--green-bg);border-color:var(--green)}
  .review-opt.wrong-opt{background:var(--red-bg);border-color:var(--red)}
  .review-explain{margin-top:10px;font-size:13.5px;color:var(--ink-soft);background:var(--paper);padding:10px 12px;border-radius:5px;border-left:3px solid var(--maroon)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;padding:8px 14px;
    border-radius:5px;border:1.5px solid var(--line);cursor:pointer;background:#fff;color:var(--ink-soft);
  }
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .hidden{display:none !important}
  a{color:var(--maroon)}
  .footer-note{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace}
  .weakbox{background:var(--red-bg);border:1px solid var(--red);border-radius:6px;padding:16px}
  .weakbox h3{color:var(--red);font-size:15px;margin-bottom:8px}
  .weakbox ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink)}
  .badgebar{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .history-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:5px;margin-bottom:8px;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="eyebrow">BPSC TRE 4.0 · Computer Science</span>
      <h1 id="titleLink" style="cursor:pointer">Teacher Recruitment Exam — Practice Portal</h1>
    </div>
    <div class="seal"><img src="/favicon.svg" alt="BPSC TRE logo"></div>
  </div>
  <div id="app"><div class="loading">Loading question bank…</div></div>
  <div class="footer-note">BPSC TRE 4.0 · Computer Science Teacher Recruitment Exam Practice Portal</div>
</div>

<script type="module">
const app = document.getElementById('app');
document.getElementById('titleLink').onclick = () => renderHome();

const SUPABASE_URL = 'https://llptkwjlikvfztxsotmk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscHRrd2psaWt2Znp0eHNvdG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI4MzQsImV4cCI6MjEwMTg2ODgzNH0.D6t8f_vOq426mrTVxPufRUqe_6LWLf-doldXJNqGEXg';
const AVAILABLE_SETS = [1, 2, 3, 4, 5]; // add new numbers here as more sets are loaded into the database
const FULL_TEST_MINUTES = 150;
const SECTION_MINUTES = { 1: 25, 2: 35, 3: 70 }; // Language, GS, CS
const PART_NAMES = { 1: 'Part I — Language', 2: 'Part II — General Studies', 3: 'Part III — Computer Science' };

let sb = null;
let state = {}; // current quiz state

function showFatalError(context, err){
  console.error(context, err);
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <h2 style="font-size:18px;margin-bottom:8px">Couldn't load the app</h2>
      <p class="muted" style="margin-bottom:16px">${context}. This is usually a temporary network hiccup.</p>
      <button class="btn maroon" onclick="location.reload()">Retry</button>
    </div>
  `;
}

let currentUser = null; // { id, email }

async function boot(){
  try {
    const mod = await import('https://esm.sh/@supabase/supabase-js@2');
    sb = mod.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (err) {
    showFatalError('Failed to load the Supabase client library from the CDN', err);
    return;
  }

  try {
    // Supabase auto-detects a magic-link token in the URL (#access_token=...) and
    // establishes a session before this resolves.
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user) {
      currentUser = { id: session.user.id, email: session.user.email };
      await attachProfileName();
    }
    // Clean the magic-link tokens out of the URL bar once consumed.
    if (window.location.hash.includes('access_token')) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  } catch (err) {
    console.error('Session check failed:', err);
  }

  sb.auth.onAuthStateChange((_event, session) => {
    // Sign-in is already handled explicitly at each call site (with profile name attached).
    // Only react here to sign-out / session loss, to avoid a race that could wipe currentUser.name.
    if (!session) currentUser = null;
  });

  try {
    currentUser ? renderHome() : renderLogin();
  } catch (err) {
    showFatalError('Failed to render the app', err);
  }
}
boot();

async function attachProfileName(){
  if (!currentUser) return;
  try {
    const { data } = await sb.from('profiles').select('full_name').eq('id', currentUser.id).single();
    if (data && data.full_name) currentUser.name = data.full_name;
  } catch (e) {
    // Non-fatal — just fall back to showing the email.
    console.error('Profile fetch failed:', e);
  }
}

function renderLogin(msg, startOnSignup, msgType){
  app.innerHTML = `
    <div class="auth-hero">
      <div class="auth-hero-inner">
        <div class="auth-seal"><img src="/favicon.svg" alt="BPSC TRE logo"></div>
        <h1 class="auth-title">BPSC TRE 4.0</h1>
        <p class="auth-subtitle">Computer Science Practice Portal</p>
        <div class="auth-badges">
          <span class="auth-badge b1">Full-Length Mock Tests</span>
          <span class="auth-badge b2">Exam-Pattern Timing</span>
          <span class="auth-badge b3">Live Leaderboard</span>
        </div>
      </div>
    </div>
    <div class="card auth-card">
      <div class="tabs auth-tabs">
        <div class="tab auth-tab ${startOnSignup ? '' : 'active'}" id="tabSignin">Sign In</div>
        <div class="tab auth-tab ${startOnSignup ? 'active' : ''}" id="tabSignup">Create Account</div>
      </div>
      ${msg ? `<p style="color:${msgType==='ok' ? 'var(--teal)' : 'var(--maroon)'};font-size:13.5px;margin:14px 0 0;font-weight:600">${msg}</p>` : ''}
      <div id="resendWrap" class="hidden" style="margin-top:8px">
        <button class="btn secondary" id="resendBtn" style="font-size:12.5px;padding:8px 14px">Resend confirmation email</button>
      </div>
      <div style="margin-top:16px">
        <div id="nameFieldWrap" class="${startOnSignup ? '' : 'hidden'}">
          <label class="muted" style="display:block;margin-bottom:6px;font-size:13px">Your name</label>
          <input type="text" id="nameInput" placeholder="e.g. Priya Sharma" style="width:100%;margin-bottom:14px" autocomplete="name">
        </div>
        <label class="muted" style="display:block;margin-bottom:6px;font-size:13px">Email address</label>
        <input type="text" id="emailInput" placeholder="you@example.com" style="width:100%;margin-bottom:14px" autocomplete="email">
        <label class="muted" style="display:block;margin-bottom:6px;font-size:13px">Password</label>
        <input type="password" id="passInput" placeholder="At least 6 characters" style="width:100%;margin-bottom:6px" autocomplete="current-password">
        <p class="muted" id="passHint" style="font-size:12px;margin-bottom:14px;${startOnSignup ? '' : 'visibility:hidden'}">Minimum 6 characters. You'll use this to sign back in next time.</p>
        <button class="btn gradient block" id="submitAuthBtn">${startOnSignup ? 'Create account & start practicing' : 'Sign in'}</button>
      </div>
    </div>
  `;
  let isSignup = !!startOnSignup;
  let lastEmailForResend = '';
  const nameFieldWrap = document.getElementById('nameFieldWrap');
  const nameInput = document.getElementById('nameInput');
  const emailInput = document.getElementById('emailInput');
  const passInput = document.getElementById('passInput');
  const passHint = document.getElementById('passHint');
  const submitBtn = document.getElementById('submitAuthBtn');
  const tabSignin = document.getElementById('tabSignin');
  const tabSignup = document.getElementById('tabSignup');
  const resendWrap = document.getElementById('resendWrap');
  const resendBtn = document.getElementById('resendBtn');

  function setMode(signup){
    isSignup = signup;
    tabSignin.classList.toggle('active', !signup);
    tabSignup.classList.toggle('active', signup);
    submitBtn.textContent = signup ? 'Create account & start practicing' : 'Sign in';
    passHint.style.visibility = signup ? 'visible' : 'hidden';
    nameFieldWrap.classList.toggle('hidden', !signup);
    passInput.setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
  }
  tabSignin.onclick = () => setMode(false);
  tabSignup.onclick = () => setMode(true);

  resendBtn.onclick = async () => {
    if (!lastEmailForResend) return;
    resendBtn.disabled = true;
    resendBtn.textContent = 'Sending…';
    try {
      const { error } = await sb.auth.resend({ type: 'signup', email: lastEmailForResend });
      if (error) throw error;
      renderLogin("Confirmation email re-sent. Check spam/junk if it doesn't arrive in a minute.", false, "ok");
    } catch (err) {
      renderLogin(`Couldn't resend: ${err.message || 'try again shortly.'}`, false);
    }
  };

  async function submit(){
    const name = nameInput ? nameInput.value.trim() : '';
    const email = emailInput.value.trim();
    const password = passInput.value;
    if (isSignup && !name) {
      renderLogin('Please enter your name.', true);
      return;
    }
    if (!email || !email.includes('@') || !email.includes('.')) {
      renderLogin('Please enter a valid email address.', isSignup);
      return;
    }
    if (!password || password.length < 6) {
      renderLogin('Password must be at least 6 characters.', isSignup);
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = isSignup ? 'Creating account…' : 'Signing in…';
    try {
      if (isSignup) {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
        if (error) throw error;
        if (data.session) {
          currentUser = { id: data.user.id, email: data.user.email, name };
          renderHome();
        } else {
          renderLogin('Account created! If your project requires it, check your email to confirm — otherwise just switch to Sign In and log in now.', false, 'ok');
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = { id: data.user.id, email: data.user.email };
        await attachProfileName();
        renderHome();
      }
    } catch (err) {
      const raw = err.message || '';
      if (/email not confirmed/i.test(raw)) {
        lastEmailForResend = email;
        resendWrap.classList.remove('hidden');
        renderLoginKeepMsg("Your email isn't confirmed yet. Check your inbox (and spam folder) for the link — or resend it below.", isSignup, lastEmailForResend);
        return;
      }
      const friendly = /invalid login credentials/i.test(raw)
        ? 'Incorrect email or password.'
        : /already registered|already exists/i.test(raw)
          ? 'That email already has an account — try Sign In instead.'
          : (raw || 'Something went wrong, please try again.');
      renderLogin(friendly, isSignup);
    }
  }

  function renderLoginKeepMsg(msg2, signup2, emailForResend){
    renderLogin(msg2, signup2);
    document.getElementById('resendWrap').classList.remove('hidden');
    lastEmailForResend = emailForResend;
    document.getElementById('resendBtn').onclick = async () => {
      const rb = document.getElementById('resendBtn');
      rb.disabled = true; rb.textContent = 'Sending…';
      try {
        const { error } = await sb.auth.resend({ type: 'signup', email: emailForResend });
        if (error) throw error;
        renderLogin("Confirmation email re-sent. Check spam/junk if it doesn't arrive in a minute.", false, "ok");
      } catch (err) {
        renderLogin(`Couldn't resend: ${err.message || 'try again shortly.'}`, false);
      }
    };
  }

  submitBtn.onclick = submit;
  passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

function requireAuth(){
  if (!currentUser){
    renderLogin('Please sign in first.');
    return false;
  }
  return true;
}

async function signOut(){
  try { await sb.auth.signOut(); } catch(e){ console.error(e); }
  currentUser = null;
  renderLogin();
}



function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

async function loadHistory(){
  const historyList = document.getElementById('historyList');
  if (!historyList) return; // user already navigated away
  let attempts = null;
  try {
    const res = await sb.from('attempts').select('*').not('submitted_at','is',null).order('started_at',{ascending:false}).limit(5);
    attempts = res.data;
    if (res.error) throw res.error;
  } catch (e) {
    console.error('History load failed:', e);
    historyList.innerHTML = `<span class="muted">Couldn't load history right now — you can still start a test.</span>`;
    return;
  }
  if (!attempts || attempts.length === 0){
    historyList.innerHTML = `<span class="muted">No attempts yet — take a test to see your history here.</span>`;
  } else {
    historyList.innerHTML = attempts.map(a => {
      const label = a.mode === 'full' ? `Full Test · Set ${a.set_number}` : `${PART_NAMES[a.part]?.split('—')[1]?.trim() || 'Section'} · Set ${a.set_number}`;

      return `<div class="history-row"><span>${label} <span class="muted">· ${date}</span></span><span class="mono" style="font-weight:600">${meritStr}</span></div>`;
    }).join('');
  }
}

let timerInterval = null;
function stopTimer(){ if (timerInterval){ clearInterval(timerInterval); timerInterval = null; } }

async function startQuiz({ mode, setNumber, part }){
  if (!requireAuth()) return;
  app.innerHTML = `<div class="loading">Preparing your paper…</div>`;
  let q = sb.from('questions').select('*').eq('set_number', setNumber).order('part').order('q_no');
  if (mode === 'section') q = q.eq('part', part);
  const { data: questions, error } = await q;
  if (error || !questions || questions.length === 0){
    app.innerHTML = `<div class="card">Could not load questions. <button class="btn secondary" onclick="location.reload()">Retry</button></div>`;
    return;
  }

  const durationSec = mode === 'full' ? FULL_TEST_MINUTES * 60 : SECTION_MINUTES[part] * 60;

  const { data: attemptRow } = await sb.from('attempts').insert({
    mode, set_number: setNumber, part: mode==='section' ? part : null, duration_seconds: durationSec, user_id: currentUser.id
  }).select().single();

  state = {
    mode, setNumber, part, questions,
    answers: {}, // question.id -> 'A'|'B'|'C'|'D'|'E'
    idx: 0,
    remaining: durationSec,
    attemptId: attemptRow ? attemptRow.id : null,
  };

  renderQuiz();
  stopTimer();
  timerInterval = setInterval(() => {
    state.remaining--;
    updateTimerDisplay();
    if (state.remaining <= 0){
      stopTimer();
      submitQuiz();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  el.textContent = fmtTime(Math.max(0,state.remaining));
  el.classList.toggle('low', state.remaining <= 60);
}

function currentPartLabel(){
  if (state.mode === 'section') return PART_NAMES[state.part];
  const q = state.questions[state.idx];
  return PART_NAMES[q.part];
}

function renderQuiz(){
  const q = state.questions[state.idx];
  const total = state.questions.length;
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="quiz-top">
      <div>
        <div class="mono" style="font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em">${currentPartLabel()}</div>
        <div style="font-size:13px;color:var(--ink-soft)">${answeredCount}/${total} answered</div>
      </div>
      <div id="timerDisplay" class="timer">${fmtTime(state.remaining)}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(answeredCount/total*100)}%"></div></div>
    <div class="qcard" style="margin-top:18px">
      <div class="qmeta">
        <span class="qnum">Q${state.idx+1} / ${total}</span>
        <span class="qtopic">${q.topic}</span>
      </div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      <div id="optionsWrap"></div>
      <div class="navrow">
        <button class="btn secondary" id="prevBtn" ${state.idx===0?'disabled':''}>← Previous</button>
        ${state.idx === total-1
          ? `<button class="btn maroon" id="submitBtn">Submit Test</button>`
          : `<button class="btn" id="nextBtn">Next →</button>`}
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <div style="font-size:12.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:8px">QUESTION PALETTE — green = answered, amber = marked none, click to jump</div>
      <div class="palette" id="palette"></div>
      <div class="navrow" style="margin-top:16px">
        <button class="btn secondary" id="submitBtn2">Submit ${state.mode==='full' ? 'Full Test' : 'Section'}</button>
      </div>
    </div>
  `;
  updateTimerDisplay();

  const opts = [
    {k:'A', v:q.option_a}, {k:'B', v:q.option_b}, {k:'C', v:q.option_c}, {k:'D', v:q.option_d},
    {k:'E', v:"None of the above / I don't want to answer this"}
  ];
  const optWrap = document.getElementById('optionsWrap');
  optWrap.innerHTML = opts.map(o => `
    <div class="option ${state.answers[q.id]===o.k ? 'selected' : ''} ${o.k==='E' ? 'none' : ''}" data-k="${o.k}">
      <div class="bubble">${o.k}</div>
      <div class="option-text">${escapeHtml(o.v)}</div>
    </div>
  `).join('');
  optWrap.querySelectorAll('.option').forEach(el => {
    el.onclick = () => {
      state.answers[q.id] = el.dataset.k;
      renderQuiz();
    };
  });

  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.onclick = () => { state.idx--; renderQuiz(); };
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.onclick = () => { state.idx++; renderQuiz(); };
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.onclick = confirmSubmit;
  document.getElementById('submitBtn2').onclick = confirmSubmit;

  const palette = document.getElementById('palette');
  palette.innerHTML = state.questions.map((qq, i) => {
    const ans = state.answers[qq.id];
    const cls = ans === 'E' ? 'none-ans' : (ans ? 'answered' : '');
    return `<div class="pnode ${cls} ${i===state.idx?'current':''}" data-i="${i}">${i+1}</div>`;
  }).join('');
  palette.querySelectorAll('.pnode').forEach(el => {
    el.onclick = () => { state.idx = parseInt(el.dataset.i); renderQuiz(); };
  });
}

function confirmSubmit(){
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const unanswered = total - answered;
  const msg = unanswered > 0
    ? `You have ${unanswered} unanswered question(s). Submit anyway?`
    : `Submit your test now? You won't be able to change answers after this.`;
  if (confirm(msg)) submitQuiz();
}

async function submitQuiz(){
  stopTimer();
  const q = state.questions;
  let languageCorrect=0, languageTotal=0, meritCorrect=0, meritTotal=0;
  const topicStats = {}; // topic -> {correct, total}

  const answerRows = q.map(qq => {
    const sel = state.answers[qq.id] || null;
    const isCorrect = sel === qq.correct_option;
    if (qq.part === 1){ languageTotal++; if (isCorrect) languageCorrect++; }
    else { meritTotal++; if (isCorrect) meritCorrect++; }
    if (!topicStats[qq.topic]) topicStats[qq.topic] = {correct:0, total:0};
    topicStats[qq.topic].total++;
    if (isCorrect) topicStats[qq.topic].correct++;
    return { attempt_id: state.attemptId, question_id: qq.id, selected_option: sel, is_correct: isCorrect };
  });

  state.result = { languageCorrect, languageTotal, meritCorrect, meritTotal, topicStats };

  if (state.attemptId){
    try {
      await sb.from('attempts').update({
        submitted_at: new Date().toISOString(),
        merit_score: meritTotal>0 ? meritCorrect : null,
        merit_total: meritTotal>0 ? meritTotal : null,
        language_score: languageTotal>0 ? languageCorrect : null,
        language_total: languageTotal>0 ? languageTotal : null,
      }).eq('id', state.attemptId);
      if (answerRows.length) await sb.from('attempt_answers').insert(answerRows);
    } catch(e){ console.error('Save failed (showing results anyway):', e); }
  }

  renderResults();
}

function renderResults(){
  const { meritCorrect, meritTotal, languageCorrect, languageTotal, topicStats } = state.result;
  const meritPct = meritTotal ? Math.round(meritCorrect/meritTotal*100) : null;
  let verdict = '';
  if (meritTotal > 0){
    if (meritPct >= 82) verdict = 'Comfortably above the projected TRE 4.0 cut-off range (~82–87%). Keep this consistency.';
    else if (meritPct >= 70) verdict = 'Close to the danger zone — projected cut-off is ~82–87%. Push weak topics below.';
    else verdict = 'Below the safe target. Revisit weak topics below before your next attempt.';
  }

  const sortedTopics = Object.entries(topicStats).sort((a,b) => (a[1].correct/a[1].total) - (b[1].correct/b[1].total));
  const weak = sortedTopics.filter(([,s]) => (s.correct/s.total) < 0.6);

  app.innerHTML = `
    ${meritTotal > 0 ? `
    <div class="score-hero">
      <div class="big">${meritCorrect}<span style="font-size:26px;color:#B7BEC9">/${meritTotal}</span></div>
      <div class="lbl">Merit Score (Part II + III)</div>
      <div class="verdict">${verdict}</div>
    </div>` : ''}
    <div class="stat-row">
      ${languageTotal > 0 ? `<div class="stat"><div class="num">${languageCorrect}/${languageTotal}</div><div class="lbl">Language (Qualifying)</div></div>` : ''}
      ${meritTotal > 0 ? `<div class="stat"><div class="num">${meritPct}%</div><div class="lbl">Merit Accuracy</div></div>` : ''}
      <div class="stat"><div class="num">${Object.keys(state.answers).length}/${state.questions.length}</div><div class="lbl">Attempted</div></div>
    </div>

    <div class="card">
      <h2 style="font-size:16px;margin-bottom:14px">Topic-wise accuracy</h2>
      ${sortedTopics.map(([topic, s]) => {
        const pct = Math.round(s.correct/s.total*100);
        const color = pct >= 75 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
        return `<div class="topicbar-row">
          <div class="topicbar-label">${topic}</div>
          <div class="topicbar-track"><div class="topicbar-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="topicbar-pct">${pct}%</div>
        </div>`;
      }).join('')}
    </div>

    ${weak.length ? `
    <div class="card weakbox">
      <h3>Weak areas (below 60%)</h3>
      <ul>${weak.map(([t,s]) => `<li>${t} — ${Math.round(s.correct/s.total*100)}% (${s.correct}/${s.total})</li>`).join('')}</ul>
    </div>` : ''}

    <div class="card">
      <h2 style="font-size:16px;margin-bottom:14px">Full Review — every question, correct answer & explanation</h2>
      <div id="reviewList"></div>
    </div>

    <div class="navrow">
      <button class="btn secondary" id="retakeBtn">↺ Retake this test</button>
      <button class="btn maroon" id="homeBtn">Back to Home</button>
    </div>
  `;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = state.questions.map((qq, i) => {
    const sel = state.answers[qq.id];
    const isCorrect = sel === qq.correct_option;
    const status = !sel ? 'skipped' : (isCorrect ? 'correct' : 'wrong');
    const opts = [
      {k:'A', v:qq.option_a}, {k:'B', v:qq.option_b}, {k:'C', v:qq.option_c}, {k:'D', v:qq.option_d},
      {k:'E', v:'None of the above'}
    ];
    return `
      <div class="review-q">
        <div class="qmeta">
          <span class="qnum">Q${i+1}</span>
          <span class="rowbadge ${status}">${status}</span>
        </div>
        <div class="qtext">${escapeHtml(qq.question)}</div>
        ${opts.map(o => {
          let cls = '';
          if (o.k === qq.correct_option) cls = 'correct-opt';
          else if (o.k === sel && sel !== qq.correct_option) cls = 'wrong-opt';
          const marker = o.k === qq.correct_option ? ' ✓' : (o.k === sel ? ' ✗ (your pick)' : '');
          return `<div class="review-opt ${cls}"><div class="bubble" style="width:22px;height:22px;font-size:11px">${o.k}</div><span>${escapeHtml(o.v)}${marker}</span></div>`;
        }).join('')}
        <div class="review-explain"><strong>Why:</strong> ${escapeHtml(qq.explanation)}</div>
      </div>
    `;
  }).join('');

  document.getElementById('homeBtn').onclick = renderHome;
  document.getElementById('retakeBtn').onclick = () => startQuiz({ mode: state.mode, setNumber: state.setNumber, part: state.part });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

</script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
