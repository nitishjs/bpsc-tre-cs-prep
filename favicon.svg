<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#1C2740" stroke="#E8A93B" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#8B2331" stroke-width="2"/>
  <!-- Mortarboard cap top -->
  <polygon points="60,18 95,36 60,54 25,36" fill="#E8A93B"/>
  <!-- Cap button -->
  <circle cx="60" cy="18" r="3" fill="#1C2740"/>
  <!-- Tassel string -->
  <line x1="95" y1="36" x2="95" y2="56" stroke="#E8A93B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="95" cy="59" r="4" fill="#8B2331"/>
  <!-- CS text -->
  <text x="60" y="80" font-family="Arial Black, Arial" font-weight="900" font-size="22" fill="#F6F2E8" text-anchor="middle">CS</text>
  <!-- Bottom label -->
  <text x="60" y="98" font-family="Arial" font-weight="700" font-size="10" fill="#E8A93B" text-anchor="middle" letter-spacing="1">BPSC TRE</text>
</svg>
